<!doctype html>
<meta charset="utf-8">
<title>lua-os</title>
<style>
html, body {
	margin: 0;
	height: 100%;
	background: #000;
	overflow: hidden;
}
#screen {
	display: block;
	margin: 0 auto;
	height: 100%;
	image-rendering: pixelated;
	touch-action: none;
	/* the browser's cursor stays: this screen has no hardware one for
	   task/fb.lua to draw, the way the T-Deck's lcd does. */
}
#note {
	position: fixed;
	inset: 0;
	display: grid;
	place-content: center;
	color: #999;
	font: 14px monospace;
	white-space: pre-wrap;
	text-align: center;
}
</style>

<canvas id="screen" width="1024" height="768" tabindex="0"></canvas>
<div id="note">starting…</div>

<script>
// the page half: it owns the events and the glass, and nothing else.
// The machine runs in a worker, because boot() never returns and would
// leave this thread unable to answer anything -- including the events
// below, and including the paint.

const WAKE = 0, KHEAD = 1, KTAIL = 2;
const PTRX = 3, PTRY = 4, PTRB = 5, PTRMOVED = 6, PTRWHEEL = 7;
const KEYS = 8, KEYRING = 256;

const note = document.getElementById('note');
const canvas = document.getElementById('screen');
const W = canvas.width, H = canvas.height;

function fail(text) {
	note.textContent = text;
	note.style.display = '';
}

if (!crossOriginIsolated) {
	fail('this page needs cross-origin isolation for SharedArrayBuffer.\n' +
		'serve it with COOP: same-origin and COEP: require-corp --\n' +
		'machine/wasm/serve.js does exactly that.');
	throw new Error('not cross-origin isolated');
}

const shared = new SharedArrayBuffer((KEYS + KEYRING) * 4);
const sab = new Int32Array(shared);

// the screen the worker writes and this thread reads. Shared rather
// than sent: a frame is 3MB and copying one per paint would cost more
// than drawing it.
const screen = new SharedArrayBuffer(W * H * 4);
const pixels = new Uint8Array(screen);

const ctx = canvas.getContext('2d', { alpha: false });
const img = new ImageData(W, H);

// ImageData cannot be backed by shared memory, so the damaged rows are
// copied into it -- the damaged rows only, which is why fb_flush sends
// a rectangle rather than a flag.
function paint({ x, y, w, h }) {
	for (let row = y; row < y + h; row++) {
		const off = (row * W + x) * 4;

		img.data.set(pixels.subarray(off, off + w * 4), off);
	}
	ctx.putImageData(img, 0, 0, x, y, w, h);
}

// one keystroke, which may be several bytes. The tail moves once, at
// the end: an arrow is ESC [ A, and a machine that read part of it
// would hand a program a bare ESC -- which most read as "leave".
// Dropped whole when the ring is full, rather than wrapped onto unread
// keys or delivered in half.
function keypush(seq) {
	const head = Atomics.load(sab, KHEAD);
	let tail = Atomics.load(sab, KTAIL);

	for (const c of seq) {
		const next = (tail + 1) % KEYRING;

		if (next === head)
			return;
		Atomics.store(sab, KEYS + tail, c);
		tail = next;
	}
	Atomics.store(sab, KTAIL, tail);
}

function wake() {
	Atomics.notify(sab, WAKE);
}

// what a terminal sends, because the line editor on the other end of
// this was written against a serial line.
const NAMED = {
	Enter: [13], Backspace: [127], Escape: [27], Tab: [9],
	ArrowUp: [27, 91, 65], ArrowDown: [27, 91, 66],
	ArrowRight: [27, 91, 67], ArrowLeft: [27, 91, 68],
	Home: [27, 91, 72], End: [27, 91, 70], Delete: [27, 91, 51, 126],
};

addEventListener('keydown', (e) => {
	if (e.metaKey)
		return;
	if (e.ctrlKey) {
		const k = e.key.toLowerCase();

		if (k >= 'a' && k <= 'z') {
			keypush([k.charCodeAt(0) - 96]);
			e.preventDefault();
			wake();
		}
		return;
	}
	if (NAMED[e.key])
		keypush(NAMED[e.key]);
	else if ([...e.key].length === 1)
		keypush(new TextEncoder().encode(e.key));
	else
		return;
	e.preventDefault();
	wake();
});

// the canvas is scaled to the window, so a click has to come back
// through the same transform or the pointer drifts further from the
// cursor the larger the window gets.
function ptrpos(e) {
	const r = canvas.getBoundingClientRect();
	let x = Math.floor((e.clientX - r.left) / r.width * W);
	let y = Math.floor((e.clientY - r.top) / r.height * H);

	x = Math.max(0, Math.min(W - 1, x));
	y = Math.max(0, Math.min(H - 1, y));
	Atomics.store(sab, PTRX, x);
	Atomics.store(sab, PTRY, y);
	// the DOM says 1 left, 2 right, 4 middle; the guest says
	// 1 left, 2 middle, 4 right.
	const b = e.buttons;

	Atomics.store(sab, PTRB, (b & 1) | ((b & 4) >> 1) | ((b & 2) << 1));
	Atomics.store(sab, PTRMOVED, 1);
	wake();
}

for (const t of ['pointermove', 'pointerdown', 'pointerup'])
	canvas.addEventListener(t, (e) => { ptrpos(e); e.preventDefault(); });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// the wheel, which the guest reads as plan 9 does: buttons 8 and 16,
// one click at a time. Counted rather than stored, because a click is
// an event and the pointer is otherwise a state -- a bit set and
// cleared between two polls would never be seen.
canvas.addEventListener('wheel', (e) => {
	const clicks = e.deltaY < 0 ? 1 : -1;

	ptrpos(e);
	Atomics.add(sab, PTRWHEEL, clicks);
	e.preventDefault();
	wake();
}, { passive: false });

const worker = new Worker('worker.js');

worker.onmessage = (e) => {
	const m = e.data;

	if (m.paint)
		paint(m.paint);
	else if (m.ready)
		note.style.display = 'none';
	else if (m.error)
		fail('the machine did not start:\n\n' + m.error);
	else if (m.halted !== undefined)
		fail('machine halted');
};

// a worker that dies says nothing on its own, and the page would sit
// at "starting…" forever.
worker.onerror = (e) =>
	fail('worker error:\n\n' + (e.message || e) + '\n' +
		(e.filename || '') + ':' + (e.lineno || ''));

worker.postMessage({
	shared,
	screen,
	url: 'luaos.wasm',
	membytes: 96 * 1024 * 1024,
	w: W,
	h: H,
});

canvas.focus();
</script>
